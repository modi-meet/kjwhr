# Dev convenience only: hot-reloading API + Vite dev server (proxying /api to the API).
# The reviewer-facing artifact is the single image built from ./Dockerfile.
services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install -q -r requirements.txt && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app/web
    volumes:
      - ./:/app
    environment:
      - VITE_API_PROXY=http://api:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api
